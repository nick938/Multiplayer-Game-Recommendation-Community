name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # 允许在 Actions 页手动触发

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 部署不在这里：push main 的部署由 Cloudflare Git 集成（Workers Builds）执行，
# 构建环境自带认证，无需 API Token。本 workflow 只做校验（单测 / typecheck / 真实构建），
# 详见 DEPLOYMENT.md「自动部署」。

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # reads the version from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @mgc/db embed

      # 推荐引擎单测（平台兼容矩阵是核心资产，必须每次验证）
      - run: pnpm --filter @mgc/recommendation test

      - run: pnpm -r typecheck

      # 构建 OpenNext Worker 产物（.open-next/）——验证真实部署物可构建（PR 上同样执行）
      - run: pnpm --filter @mgc/web build:worker
        env:
          DEPLOYMENT_TARGET: global
